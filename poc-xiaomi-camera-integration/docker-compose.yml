services:
  backend:
    build:
      context: ..
      dockerfile: poc-xiaomi-camera-integration/backend/Dockerfile
    container_name: poc-camera-backend
    # Use bridge network but expose port for host access
    expose:
      - "8080"
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SERVER_LOG_LEVEL=${SERVER_LOG_LEVEL:-info}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI:-https://127.0.0.1}
      - CLOUD_SERVER=${CLOUD_SERVER:-cn}
      - FRAME_INTERVAL=${FRAME_INTERVAL:-500}
      - CACHE_DIR=/app/cache
    volumes:
      - poc_cache:/app/cache
    networks:
      - miloco-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poc-camera-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - miloco-net
    restart: unless-stopped

volumes:
  poc_cache:

networks:
  miloco-net:
    driver: bridge
