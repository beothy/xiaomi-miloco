services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: poc-camera-backend
    # NOTICE: host network is required for mDNS/LAN camera discovery
    network_mode: host
    environment:
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SERVER_LOG_LEVEL=${SERVER_LOG_LEVEL:-info}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - OAUTH2_REDIRECT_URI=${OAUTH2_REDIRECT_URI:-https://127.0.0.1}
      - CLOUD_SERVER=${CLOUD_SERVER:-cn}
      - FRAME_INTERVAL=${FRAME_INTERVAL:-500}
      - CACHE_DIR=/app/cache
    volumes:
      - poc_cache:/app/cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: poc-camera-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  poc_cache:
